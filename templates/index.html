
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a sentence to detect its emotions.</p>

    <form action="/emotionDetector" method="get">
        <label for="textToAnalyze">Your text:</label>
        <input
            type="text"
            id="textToAnalyze"
            name="textToAnalyze"
            required
        >
        <button type="submit">Analyze Emotion</button>
    </form>
</body>
</html>
